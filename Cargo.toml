[package]
name = "cloudpreflight"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "IaC preflight for cloud cost: estimate what a Terraform change will cost before it ships"
license = "Apache-2.0"
repository = "https://github.com/factualminds-aws-partner/cloudpreflight"
readme = "README.md"
keywords = ["terraform", "aws", "finops", "cost", "cli"]
categories = ["command-line-utilities"]
exclude = ["fixtures/", "tests/", ".github/"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dirs = "7.0.0"
hcl-rs = "0.19.8"
ignore = "0.4.33"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rust_decimal = { version = "1.43.0", features = ["macros", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
tokio = { version = "1.53.2", features = ["net", "io-util"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
